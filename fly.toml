# Fly.io config for the sauce API. First run: `fly launch --copy-config --no-deploy`, then the secrets and volume
# commands in docs/HOSTING.md, then `fly deploy`.
app = "sauce-api"
primary_region = "sjc"

[build]

[env]
  SAUCE_DB = "/data/sauce.db"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "sauce_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
